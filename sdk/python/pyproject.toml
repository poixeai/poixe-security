[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poixe-encrypt"
version = "0.1.0"
description = "Client-side API key encryption for Poixe channels"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["poixe", "encryption", "api-key"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/poixeai/poixe-security"
Repository = "https://github.com/poixeai/poixe-security"

[tool.hatch.build.targets.wheel]
packages = ["poixe_encrypt"]
